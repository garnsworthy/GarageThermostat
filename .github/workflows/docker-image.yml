name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: |
           docker build . --file Dockerfile --tag garage:$(date +%s) garage:latest
           docker push ghcr.io/garnsworthy/garage:$(date +%s)
           docker push ghcr.io/garnsworthy/garage:latest
